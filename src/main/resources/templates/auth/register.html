<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>新規アカウント登録</title>
</head>
<body>
<div class="container">
    <h2>新規アカウント登録</h2>
    <div th:if="${errorMessage}" style="color: red; margin-bottom: 10px;">
        <p th:text="${errorMessage}"></p>
    </div>
    <form th:action="@{/register}" th:object="${user}" method="post">
        <div>
            <label>ユーザー名:</label>
            <input type="text" th:field="*{username}" required/>
            <span th:if="${#fields.hasErrors('username')}" th:errors="*{username}" style="color: red;"></span>
        </div>
        <div>
            <label>メールアドレス:</label>
            <input type="email" th:field="*{email}" required/>
            <span th:if="${#fields.hasErrors('email')}" th:errors="*{email}" style="color: red;"></span>
        </div>
        <div>
            <label>パスワード:</label>
            <input type="password" th:field="*{password}" required/>
            <span th:if="${#fields.hasErrors('password')}" th:errors="*{password}" style="color: red;"></span>
        </div>
        <div>
            <button type="submit">登録する</button>
        </div>
    </form>

    <hr>
    <p>すでにアカウントをお持ちの方は <a th:href="@{/login}">こちらからログイン</a></p>
</div>
</body>
</html>
