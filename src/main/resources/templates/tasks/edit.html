<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>タスク編集</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container py-4">
<h1 class="mb-4">タスク編集</h1>

<form th:action="@{/view/tasks/{id}/update(id=*{id})}" th:object="${task}" method="post" class="col-md-6">
    <!-- 特定の相関チェックエラーのみ表示 -->
    <div th:if="${#fields.hasErrors('statusDoneValid') or #fields.hasErrors('dateOrderValid')}"
         class="alert alert-danger">
        <ul class="mb-0">
            <li th:if="${#fields.hasErrors('statusDoneValid')}" th:errors="*{statusDoneValid}"></li>
            <li th:if="${#fields.hasErrors('dateOrderValid')}" th:errors="*{dateOrderValid}"></li>
        </ul>
    </div>
    <!-- IDは画面に出さず、内部的に送信する -->
    <input type="hidden" th:field="*{id}">
    <div class="mb-3">
        <label for="title" class="form-label">タイトル</label>
        <input id="title" type="text" th:field="*{title}" class="form-control"
               th:classappend="${#fields.hasErrors('title')} ? 'is-invalid'">
        <div class="invalid-feedback" th:if="${#fields.hasErrors('title')}" th:errors="*{title}">
            エラーメッセージ
        </div>
    </div>
    <div class="mb-3">
        <label for="description" class="form-label">内容</label>
        <textarea th:field="*{description}" class="form-control" id="description" rows="3"></textarea>
    </div>
    <div class="mb-3">
        <label for="startDate" class="form-label">開始日</label>
        <input type="date" th:field="*{startDate}" class="form-control" id="startDate">
    </div>
    <div class="mb-3">
        <label for="dueDate" class="form-label">期限日</label>
        <input type="date" th:field="*{dueDate}" class="form-control" id="dueDate">
    </div>
    <div class="mb-3">
        <label for="priority" class="form-label">優先度</label>
        <select th:field="*{priority}" class="form-select" id="priority">
            <option value="CRITICAL" th:text="#{critical}"></option>
            <option value="HIGH" th:text="#{high}"></option>
            <option value="MEDIUM" th:text="#{medium}"></option>
            <option value="LOW" th:text="#{low}"></option>
        </select>
    </div>
    <div class="mb-3">
        <label for="status" class="form-label">ステータス</label>
        <select th:field="*{status}" class="form-select" id="status">
            <option value="TODO" th:text="#{todo}"></option>
            <option value="DOING" th:text="#{doing}"></option>
            <option value="DONE" th:text="#{done}"></option>
            <option value="PENDING" th:text="#{pending}"></option>
        </select>
    </div>
    <div class="mb-3 form-check">
        <input type="checkbox" th:field="*{completed}" class="form-check-input" id="completed">
        <label class="form-check-label" for="completed">完了にする</label>
    </div>

    <button type="submit" class="btn btn-primary">更新する</button>
    <a th:href="@{/view/tasks}" class="btn btn-outline-secondary">キャンセル</a>
</form>
</body>
</html>
