<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>タスク一覧</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<header>
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
        <p class="mb-0">ログイン中: <strong th:text="${#authentication.name}"></strong> さん</p>

        <p class="mb-0" style="font-size: 0.9rem; color: #666;">
            <span th:text="${#temporals.format(#temporals.createNow(), 'yyyy年MM月dd日')}"></span>
        </p>
    </div>
    <div style="display: flex; justify-content: space-between; align-items: center;">
        <h1 class="mb-0">タスク一覧</h1>

        <form th:action="@{/logout}" method="post" class="mb-0">
            <button type="submit"
                    style="background-color: #f44336; color: white; border: none; padding: 5px 10px; cursor: pointer;">
                ログアウト
            </button>
        </form>
    </div>
    <hr> <!-- 境界線を入れるとよりスッキリします（お好みで） -->
</header>
<body class="container py-4">
<!--検索-->
<div class="row mb-4">
    <div class="col-md-6">
        <form th:action="@{/view/tasks}" method="get" class="d-flex gap-2">
            <input type="text" name="keyword" th:value="${displayData.keyword}"
                   class="form-control" placeholder="タイトルで検索...">

            <select name="status" class="form-select">
                <option value="">すべてのステータス</option>
                <option th:each="s : ${T(com.m_takahisa.taskapp.task.TaskStatus).values()}"
                        th:value="${s}"
                        th:text="${s.displayName}"
                        th:selected="${s == displayData.status}">
                </option>
            </select>

            <button type="submit" class="btn btn-secondary">検索</button>
            <a th:href="@{/view/tasks}" class="btn btn-outline-secondary">クリア</a>
        </form>
    </div>
</div>

<!--登録画面へのリンク-->
<div class="mb-3">
    <a th:href="@{/view/tasks/new}" class="btn btn-success">＋ 新規タスク作成</a>
</div>

<!--期限の通知-->
<div th:if="${unreadNotifications != null && !unreadNotifications.empty}">
    <div th:each="n : ${unreadNotifications}"
         class="alert alert-warning d-flex justify-content-between align-items-center" role="alert">
        <div>
            <i class="bi bi-exclamation-triangle-fill"></i>
            <span th:text="${n.message}">通知メッセージ</span>
        </div>
        <form th:action="@{/view/tasks/notifications/{id}/read(id=${n.id})}" method="post" class="mb-0">
            <button type="submit" class="btn-close" aria-label="Close"></button>
        </form>
    </div>
</div>

<!--タスク一覧-->
<table class="table table-striped table-hover">
    <thead class="table-dark">
    <tr>
        <th>タイトル</th>
        <th>優先度</th>
        <th>ステータス</th>
        <th>開始日</th>
        <th>期限日</th>
        <th>完了</th>
        <th>作成日時</th>
        <th>更新日時</th>
        <th>操作</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="task : ${displayData.tasks}"
        th:onclick="|location.href='@{/view/tasks/{id}(id=${task.id})}'|"
        style="cursor: pointer;">
        <td th:text="${task.title}"></td>
        <td>
            <span class="badge bg-info text-dark" th:text="${task.priorityDisplayName}"></span>
        </td>
        <td>
            <span class="badge bg-info text-dark" th:text="${task.statusDisplayName}"></span>
        </td>
        <td th:text="${task.startDate}"></td>
        <td th:text="${task.dueDate}"></td>
        <td>
            <span th:if="${task.completed}" class="text-success" th:text="#{completed}"></span>
            <span th:unless="${task.completed}" class="text-secondary" th:text="#{incomplete}"></span>
        </td>
        <td th:text="${#temporals.format(task.createdAt, 'yyyy/MM/dd HH:mm')}"></td>
        <td th:text="${#temporals.format(task.updatedAt, 'yyyy/MM/dd HH:mm')}"></td>
        <td>
            <div class="d-flex gap-2">
                <a th:href="@{/view/tasks/{id}/edit(id=${task.id})}" class="btn btn-outline-primary btn-sm">編集</a>

                <form th:action="@{/view/tasks/{id}/delete(id=${task.id})}" method="post"
                      onsubmit="event.stopPropagation(); return confirm('本当に削除しますか？');">
                    <button type="submit" class="btn btn-outline-danger btn-sm">削除</button>
                </form>
            </div>
        </td>
    </tr>
    </tbody>
</table>

<div th:if="${#lists.isEmpty(displayData.tasks)}" class="alert alert-warning">
    タスクが登録されていません。
</div>
</body>
</html>
